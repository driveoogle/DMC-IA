<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APERÇU — AetherFlowHero · DMC IA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: black; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

  /* Canvas plein écran en fond */
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* Contenu hero centré */
  .hero {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 9999px;
    background: rgba(168, 85, 247, 0.1);
    border: 1px solid rgba(168, 85, 247, 0.2);
    margin-bottom: 1.5rem;
    backdrop-filter: blur(8px);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease forwards 0.5s;
  }
  .badge svg { width: 16px; height: 16px; color: #a855f7; }
  .badge span { font-size: 0.875rem; font-weight: 500; color: #e5e7eb; }

  /* H1 */
  h1 {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-bottom: 1.5rem;
    background: linear-gradient(to bottom, #ffffff, #9ca3af);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease forwards 0.7s;
  }

  /* Subtitle */
  p.sub {
    max-width: 42rem;
    font-size: 1.125rem;
    color: #9ca3af;
    margin-bottom: 2.5rem;
    line-height: 1.75;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease forwards 0.9s;
  }

  /* CTA Button */
  .cta-wrap {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s ease forwards 1.1s;
  }
  button.cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 1rem 2rem;
    background: white;
    color: black;
    font-weight: 600;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: background 0.2s;
  }
  button.cta:hover { background: #e5e7eb; }
  button.cta svg { width: 20px; height: 20px; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Preview banner */
  .preview-banner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 9999;
    background: rgba(124, 92, 252, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 0.75rem 2rem;
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    color: white;
  }
  .preview-badge {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 100px;
    padding: 2px 10px;
    font-size: 0.68rem;
  }
  code {
    background: rgba(255,255,255,0.15);
    padding: 2px 7px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="hero">

  <!-- Badge -->
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <span>Dynamic Rendering Engine</span>
  </div>

  <!-- Title -->
  <h1>Aether Flow</h1>

  <!-- Subtitle -->
  <p class="sub">
    An intelligent, adaptive framework for creating fluid digital experiences
    that feel alive and respond to user interaction in real-time.
  </p>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="cta">
      Explore the Engine
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

</div>

<!-- Preview banner -->
<div class="preview-banner">
  <span class="preview-badge">APERÇU</span>
  <strong>AetherFlowHero</strong>
  <span style="opacity:0.6">·</span>
  <span style="opacity:0.8">Bougez la souris pour repousser les particules</span>
  <span style="opacity:0.6">·</span>
  <span style="opacity:0.8">Route : <code>/demo</code> dans le Next.js app</span>
</div>

<script>
// ── Particle system — fidèle au composant React ──
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
const mouse = { x: null, y: null, radius: 200 };

let particles = [];
let animId;

class Particle {
  constructor(x, y, dx, dy, size) {
    this.x = x; this.y = y;
    this.dx = dx; this.dy = dy;
    this.size = size;
    this.color = 'rgba(191, 128, 255, 0.8)';
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
  update() {
    if (this.x > canvas.width  || this.x < 0) this.dx = -this.dx;
    if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;

    if (mouse.x !== null) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < mouse.radius + this.size) {
        const fx = dx / dist, fy = dy / dist;
        const force = (mouse.radius - dist) / mouse.radius;
        this.x -= fx * force * 5;
        this.y -= fy * force * 5;
      }
    }

    this.x += this.dx;
    this.y += this.dy;
    this.draw();
  }
}

function init() {
  particles = [];
  const n = (canvas.height * canvas.width) / 9000;
  for (let i = 0; i < n; i++) {
    const size = Math.random() * 2 + 1;
    const x = Math.random() * (canvas.width  - size * 4) + size * 2;
    const y = Math.random() * (canvas.height - size * 4) + size * 2;
    particles.push(new Particle(x, y,
      Math.random() * 0.4 - 0.2,
      Math.random() * 0.4 - 0.2,
      size
    ));
  }
}

function connect() {
  for (let a = 0; a < particles.length; a++) {
    for (let b = a; b < particles.length; b++) {
      const dist = (particles[a].x - particles[b].x)**2
                 + (particles[a].y - particles[b].y)**2;
      if (dist < (canvas.width/7) * (canvas.height/7)) {
        const opacity = 1 - dist / 20000;
        const dx = particles[a].x - (mouse.x ?? 0);
        const dy = particles[a].y - (mouse.y ?? 0);
        const dm = Math.sqrt(dx*dx + dy*dy);
        ctx.strokeStyle = (mouse.x !== null && dm < mouse.radius)
          ? `rgba(255,255,255,${opacity})`
          : `rgba(200,150,255,${opacity})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(particles[a].x, particles[a].y);
        ctx.lineTo(particles[b].x, particles[b].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  animId = requestAnimationFrame(animate);
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => p.update());
  connect();
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  init();
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseout',  () => { mouse.x = null; mouse.y = null; });

resize();
animate();
</script>
</body>
</html>
