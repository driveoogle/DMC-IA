<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live privé | DMC IA</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b12;color:#eee;font-family:'DM Sans',system-ui,sans-serif;padding:16px}
  .box{width:100%;max-width:960px;text-align:center}
  form{max-width:360px;margin:0 auto;display:grid;gap:12px}
  h1{font-weight:500;font-size:1.4rem;margin:0 0 20px}
  input,button{padding:14px;border-radius:10px;border:1px solid #333;background:#16161f;color:#eee;font-size:1rem}
  button{background:#7c5cfc;border:0;cursor:pointer}
  .err{color:#ff7a7a;min-height:1.2em;font-size:.9rem}
  .player{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Accès au live privé</h1>
  <form id="f">
    <input id="user" placeholder="Identifiant" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button type="submit">Regarder</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
// URL de la fonction Vercel (voir live-api/README.md)
var LIVE_API = 'https://REMPLACER-PAR-VOTRE-PROJET.vercel.app/api/live';

var params = new URLSearchParams(location.search);
var userInput = document.getElementById('user');
if (params.get('k')) { userInput.value = params.get('k'); userInput.readOnly = true; document.getElementById('pw').focus(); }

document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('err');
  err.textContent = '';
  fetch(LIVE_API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: userInput.value, password: document.getElementById('pw').value})
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { err.textContent = 'Identifiant ou mot de passe incorrect.'; return; }
    document.getElementById('box').innerHTML =
      '<div class="player"><iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube-nocookie.com/embed/' +
      encodeURIComponent(d.videoId) + '?autoplay=1&rel=0"></iframe></div>';
  }).catch(function () { err.textContent = 'Erreur de connexion, réessayez.'; });
});
</script>
</body>
</html>
