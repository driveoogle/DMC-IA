<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMC IA — CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c10;--bg2:#12121a;--bg3:#18181f;--bg4:#1e1e28;
  --border:rgba(255,255,255,0.07);
  --accent:#00e5a0;--accent2:#7c5cfc;
  --text:#f0f0f5;--text-dim:#9090a8;--text-faint:#5a5a72;
  --radius:10px;
  --new:#00e5a0;--open:#7c5cfc;--inprogress:#f59e0b;--qualified:#3b82f6;--unqualified:#6b7280;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── Lock screen ── */
#lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.lock-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;}
.lock-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2rem;}
.lock-logo svg{width:32px;height:32px;}
.lock-logo span{font-size:1.25rem;font-weight:500;letter-spacing:-0.02em;}
.lock-card h2{font-size:1rem;font-weight:400;color:var(--text-dim);margin-bottom:1.5rem;}
.lock-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border .2s;margin-bottom:12px;}
.lock-input:focus{border-color:var(--accent);}
.lock-btn{width:100%;background:var(--accent);color:var(--bg);font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.9rem;padding:11px;border:none;border-radius:8px;cursor:pointer;transition:all .2s;}
.lock-btn:hover{background:#00ffb3;box-shadow:0 0 20px rgba(0,229,160,0.3);}
.lock-err{font-size:0.8rem;color:#f87171;margin-top:10px;min-height:18px;}

/* ── Layout ── */
#app{display:none;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 1rem;}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:2.5rem;padding:0 0.5rem;}
.sidebar-logo svg{width:28px;height:28px;}
.sidebar-logo span{font-size:1.05rem;font-weight:500;}
.sidebar-label{font-size:0.65rem;font-family:'DM Mono',monospace;color:var(--text-faint);letter-spacing:0.1em;text-transform:uppercase;padding:0 0.5rem;margin-bottom:0.5rem;margin-top:1rem;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-dim);font-size:0.875rem;font-weight:400;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;}
.sidebar-link svg{width:16px;height:16px;flex-shrink:0;opacity:.7;}
.sidebar-link:hover,.sidebar-link.active{background:rgba(0,229,160,0.08);color:var(--accent);}
.sidebar-link.active svg,.sidebar-link:hover svg{opacity:1;}
.sidebar-bottom{margin-top:auto;}
.logout-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-faint);font-size:0.8rem;cursor:pointer;border:none;background:none;width:100%;transition:color .15s;}
.logout-btn:hover{color:#f87171;}
.logout-btn svg{width:15px;height:15px;}

.main{margin-left:220px;padding:2rem 2.5rem;min-height:100vh;}
.page-header{margin-bottom:2rem;}
.page-header h1{font-size:1.5rem;font-weight:500;letter-spacing:-0.02em;margin-bottom:0.25rem;}
.page-header p{font-size:0.875rem;color:var(--text-dim);}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;}
.stat-label{font-size:0.72rem;font-family:'DM Mono',monospace;color:var(--text-faint);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:0.75rem;}
.stat-value{font-size:2rem;font-weight:600;letter-spacing:-0.03em;line-height:1;}
.stat-value.green{color:var(--accent);}
.stat-value.purple{color:var(--accent2);}
.stat-value.amber{color:#f59e0b;}
.stat-sub{font-size:0.75rem;color:var(--text-faint);margin-top:0.4rem;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.875rem;outline:none;transition:border .2s;}
.search-input:focus{border-color:var(--accent);}
.filter-select{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:0.875rem;outline:none;cursor:pointer;}
.refresh-btn{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text-dim);font-family:'DM Sans',sans-serif;font-size:0.875rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.refresh-btn svg{width:14px;height:14px;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn.spin svg{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Table ── */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:1px solid var(--border);}
th{padding:11px 16px;text-align:left;font-size:0.68rem;font-family:'DM Mono',monospace;color:var(--text-faint);letter-spacing:0.08em;text-transform:uppercase;font-weight:400;}
td{padding:13px 16px;font-size:0.875rem;border-bottom:1px solid rgba(255,255,255,0.04);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.02);}
.td-name{font-weight:500;color:var(--text);}
.td-email{color:var(--text-dim);font-family:'DM Mono',monospace;font-size:0.8rem;}
.td-company{color:var(--text-dim);}
.td-date{color:var(--text-faint);font-family:'DM Mono',monospace;font-size:0.78rem;}

/* ── Status badge ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:0.72rem;font-weight:500;font-family:'DM Mono',monospace;letter-spacing:0.04em;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.badge-NEW{background:rgba(0,229,160,.12);color:var(--new);}.badge-NEW::before{background:var(--new);}
.badge-OPEN{background:rgba(124,92,252,.12);color:var(--open);}.badge-OPEN::before{background:var(--open);}
.badge-IN_PROGRESS{background:rgba(245,158,11,.12);color:var(--inprogress);}.badge-IN_PROGRESS::before{background:var(--inprogress);}
.badge-QUALIFIED{background:rgba(59,130,246,.12);color:var(--qualified);}.badge-QUALIFIED::before{background:var(--qualified);}
.badge-UNQUALIFIED{background:rgba(107,114,128,.12);color:var(--unqualified);}.badge-UNQUALIFIED::before{background:var(--unqualified);}

.status-select{background:transparent;border:none;color:inherit;font-family:'DM Mono',monospace;font-size:0.72rem;font-weight:500;cursor:pointer;outline:none;padding:0;}

/* ── Empty / loading ── */
.table-msg{padding:3rem;text-align:center;color:var(--text-faint);font-size:0.875rem;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem;}

/* ── Toast ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:12px 18px;font-size:0.875rem;color:var(--text);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:1000;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:900px){
  .sidebar{width:60px;padding:1rem 0.5rem;}
  .sidebar-logo span,.sidebar-label,.sidebar-link span,.logout-btn span{display:none;}
  .sidebar-logo{justify-content:center;}
  .main{margin-left:60px;padding:1.5rem 1rem;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){display:none;}
}
</style>
</head>
<body>

<!-- Lock screen -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7c5cfc"/>
            <stop offset="100%" style="stop-color:#00e5a0"/>
          </linearGradient>
        </defs>
        <line x1="50" y1="50" x2="100" y2="100" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <line x1="150" y1="50" x2="100" y2="100" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="100" y2="150" stroke="url(#lg)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="20" fill="url(#lg)"/>
        <circle cx="150" cy="50" r="20" fill="url(#lg)"/>
        <circle cx="100" cy="150" r="20" fill="url(#lg)"/>
        <circle cx="100" cy="100" r="28" fill="url(#lg)"/>
        <circle cx="50" cy="50" r="8" fill="#0c0c10"/>
        <circle cx="150" cy="50" r="8" fill="#0c0c10"/>
        <circle cx="100" cy="150" r="8" fill="#0c0c10"/>
        <circle cx="100" cy="100" r="12" fill="#0c0c10"/>
      </svg>
      <span>DMC IA — CRM</span>
    </div>
    <h2>Accès privé — équipe DMC IA</h2>
    <input class="lock-input" id="pwd-input" type="password" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')unlock()">
    <button class="lock-btn" onclick="unlock()">Accéder</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;">
        <defs>
          <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7c5cfc"/>
            <stop offset="100%" style="stop-color:#00e5a0"/>
          </linearGradient>
        </defs>
        <line x1="50" y1="50" x2="100" y2="100" stroke="url(#lg2)" stroke-width="10" stroke-linecap="round"/>
        <line x1="150" y1="50" x2="100" y2="100" stroke="url(#lg2)" stroke-width="10" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="100" y2="150" stroke="url(#lg2)" stroke-width="10" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="20" fill="url(#lg2)"/>
        <circle cx="150" cy="50" r="20" fill="url(#lg2)"/>
        <circle cx="100" cy="150" r="20" fill="url(#lg2)"/>
        <circle cx="100" cy="100" r="28" fill="url(#lg2)"/>
        <circle cx="50" cy="50" r="8" fill="#0c0c10"/>
        <circle cx="150" cy="50" r="8" fill="#0c0c10"/>
        <circle cx="100" cy="150" r="8" fill="#0c0c10"/>
        <circle cx="100" cy="100" r="12" fill="#0c0c10"/>
      </svg>
      <span>DMC IA</span>
    </div>
    <div class="sidebar-label">Navigation</div>
    <button class="sidebar-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Tableau de bord</span>
    </button>
    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <h1>Leads & Contacts</h1>
      <p>Tous les prospects ayant soumis le formulaire de contact</p>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">Total contacts</div><div class="stat-value green" id="s-total">—</div><div class="stat-sub">tous statuts</div></div>
      <div class="stat-card"><div class="stat-label">Nouveaux</div><div class="stat-value purple" id="s-new">—</div><div class="stat-sub">statut NEW</div></div>
      <div class="stat-card"><div class="stat-label">En cours</div><div class="stat-value amber" id="s-inprogress">—</div><div class="stat-sub">IN_PROGRESS</div></div>
      <div class="stat-card"><div class="stat-label">Qualifiés</div><div class="stat-value" style="color:var(--qualified)" id="s-qualified">—</div><div class="stat-sub">QUALIFIED</div></div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search" type="text" placeholder="Rechercher nom, email, société…" oninput="filterTable()">
      </div>
      <select class="filter-select" id="filter-status" onchange="filterTable()">
        <option value="">Tous les statuts</option>
        <option value="NEW">NEW</option>
        <option value="OPEN">OPEN</option>
        <option value="IN_PROGRESS">IN_PROGRESS</option>
        <option value="QUALIFIED">QUALIFIED</option>
        <option value="UNQUALIFIED">UNQUALIFIED</option>
      </select>
      <button class="refresh-btn" id="refresh-btn" onclick="loadContacts()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Actualiser
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Société</th>
            <th>Date</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" class="table-msg"><div class="spinner"></div>Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const PASS_HASH = '6a3ed25297f9d13d323144d7ebd383ef6a833a6deeadc706dcd3e2b0372e5baa';
const SESSION_KEY = 'dmc_crm_auth';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function unlock() {
  const val = document.getElementById('pwd-input').value;
  const hash = await sha256(val);
  if (hash === PASS_HASH) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadContacts();
  } else {
    document.getElementById('lock-err').textContent = 'Mot de passe incorrect.';
    document.getElementById('pwd-input').value = '';
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// Check existing session
(async () => {
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadContacts();
  }
})();

let allContacts = [];

async function loadContacts() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spin');
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '<tr><td colspan="5" class="table-msg"><div class="spinner"></div>Chargement…</td></tr>';
  try {
    const r = await fetch('/api/contacts');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erreur API');
    allContacts = data.contacts || [];
    updateStats();
    filterTable();
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="5" class="table-msg" style="color:#f87171">Erreur : ${e.message}</td></tr>`;
  } finally {
    btn.classList.remove('spin');
  }
}

function updateStats() {
  document.getElementById('s-total').textContent = allContacts.length;
  document.getElementById('s-new').textContent = allContacts.filter(c=>c.status==='NEW'||!c.status).length;
  document.getElementById('s-inprogress').textContent = allContacts.filter(c=>c.status==='IN_PROGRESS').length;
  document.getElementById('s-qualified').textContent = allContacts.filter(c=>c.status==='QUALIFIED').length;
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const filtered = allContacts.filter(c => {
    const match = !q || c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.company.toLowerCase().includes(q);
    const statusMatch = !st || c.status === st || (!c.status && st === 'NEW');
    return match && statusMatch;
  });
  renderTable(filtered);
}

function renderTable(contacts) {
  const tbody = document.getElementById('table-body');
  if (!contacts.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="table-msg">Aucun contact trouvé.</td></tr>';
    return;
  }
  tbody.innerHTML = contacts.map(c => {
    const status = c.status || 'NEW';
    const date = c.createdAt ? new Date(c.createdAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '—';
    return `<tr>
      <td><div class="td-name">${esc(c.name)}</div></td>
      <td><div class="td-email"><a href="mailto:${esc(c.email)}" style="color:var(--text-dim);text-decoration:none;">${esc(c.email)}</a></div></td>
      <td><div class="td-company">${esc(c.company)}</div></td>
      <td><div class="td-date">${date}</div></td>
      <td>
        <span class="badge badge-${status}">
          <select class="status-select" onchange="updateStatus('${c.id}', this.value, this)">
            ${['NEW','OPEN','IN_PROGRESS','QUALIFIED','UNQUALIFIED'].map(s=>`<option value="${s}"${s===status?' selected':''}>${s}</option>`).join('')}
          </select>
        </span>
      </td>
    </tr>`;
  }).join('');
}

async function updateStatus(id, status, el) {
  const badge = el.closest('.badge');
  badge.className = `badge badge-${status}`;
  try {
    const r = await fetch('/api/update-status', {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, status})
    });
    if (!r.ok) throw new Error();
    const c = allContacts.find(c=>c.id===id);
    if (c) c.status = status;
    updateStats();
    showToast('Statut mis à jour');
  } catch {
    showToast('Erreur lors de la mise à jour', true);
  }
}

function esc(s){ return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = err ? '#f87171' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
